name: Deploy to WordPress host

# Ships the custom theme and plugins to the live server.
# WordPress core, uploads and third-party plugins are managed on the server —
# this workflow only syncs the code that lives in this repository.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Pull requests run the checks only (see the `if` on the deploy job), so they
# must not share a concurrency group with production — otherwise opening a PR
# would cancel a deploy that is mid-rsync. Keyed per ref: superseded PR runs
# cancel each other, deploys never get cancelled part-way through.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Pinned rather than inherited from whatever the runner image ships: an
      # unpinned toolchain means this job's result can change without a commit,
      # which is the opposite of what a gate is for.
      #
      # The Node 22 floor was originally chosen for mock-state-pass.mjs, which
      # needs a global WebSocket. That step now lives in mock.yml and carries
      # the reason with it. The pin stays here on its own merit — the remaining
      # node steps (`--check`, check-inline-js.js, calc-parity.js) want a fixed
      # version, not a specific one — so do not read 22 as a requirement of
      # theirs and do not drop the pin because its original reason moved.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # First, and deliberately: a live key reaching a public repository is the
      # one failure here that cannot be undone by a follow-up commit.
      - name: No secrets in shippable files
        run: perl scripts/check-no-secrets.pl

      # The step above cannot see inside an archive. Zip entries are compressed,
      # so scanning the container byte-for-byte matches nothing and reports
      # "clean" — which reads as assurance while checking nothing. This repo
      # ships scholaris-wordpress-platform.zip, and the repo is PUBLIC, so a
      # re-zip taken from a working copy holding a live key would otherwise sail
      # straight through the one gate that guards an irreversible mistake.
      - name: No secrets inside committed archives
        run: |
          archives=$(git ls-files '*.zip')
          if [ -z "$archives" ]; then
            echo "no committed archives — nothing to extract"
            exit 0
          fi
          for z in $archives; do
            echo "── scanning inside $z"
            tmp=$(mktemp -d)
            unzip -qq "$z" -d "$tmp"
            # Explicit path => no exemptions: an archive carrying a key-bearing
            # preview.html is exactly the bug being hunted. The script also
            # fails if it reads zero files, so a bad extract cannot pass.
            perl scripts/check-no-secrets.pl "$tmp"
            rm -rf "$tmp"
          done

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      # scripts/ is in scope here for the same reason it is on the JavaScript
      # step below: the checkers are hand-edited files that nothing else lints.
      # It earned its place on this step when calc-parity.php and
      # redaction-guard.php arrived — both are executed further down, so a parse
      # error would fail the build regardless, but as an opaque runtime error
      # rather than a named syntax failure pointing at the line.
      - name: PHP syntax check
        run: |
          find wp-content php scripts -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l \
            | grep -v 'No syntax errors' && exit 1 || echo "PHP OK"

      # scripts/ is in scope for the same reason php/ is on the PHP step: the
      # checkers themselves are hand-edited files that nothing else lints.
      - name: JavaScript syntax check
        run: |
          for f in $(find wp-content scripts -name '*.js'); do
            node --check "$f" || exit 1
          done
          echo "JS OK"

      - name: Inline JavaScript syntax check (HTML pages)
        run: node scripts/check-inline-js.js

      # EVERY CHECK IN THIS JOB IS ABOUT CODE THAT SHIPS. Keep it that way.
      #
      # The deploy job below rsyncs wp-content/themes/scholaris/ and the two
      # plugins — nothing else leaves this repository. A check on anything
      # outside those three directories, however good, gates the deployment of
      # code on the state of code that cannot be deployed.
      #
      # That is not hypothetical: the mock session-state pass lived here and
      # blocked deploys on the state of design/preview.html, which is never
      # shipped. It now has its own workflow (.github/workflows/mock.yml) at
      # full strength — hard failure, same push and pull_request triggers — so
      # it is still believed, it just no longer blocks the theme. Adding a
      # design/ or docs/ check back here for tidiness would recreate the
      # category error; put it in mock.yml, or its own workflow, instead.
      - name: Shell syntax check
        run: bash -n scripts/setup.sh

      # Cross-file agreements the codebase asserts in prose: agent prompts,
      # model registries, markdown rules, preview copies, auth notice flags.
      - name: Contract tests
        run: perl scripts/contract-tests.pl

      # AiCalc answers arithmetic in code rather than asking the model, so the
      # PHP evaluator and the JavaScript one in the preview page have to agree
      # exactly — same answer, same working, same refusals. Two steps because
      # the two halves run on different interpreters: the first re-derives the
      # expected results from design/preview.html, the second holds the PHP
      # port to them.
      - name: AiCalc reference is unchanged
        run: node scripts/calc-parity.js

      - name: AiCalc PHP port matches the reference
        run: php scripts/calc-parity.php

      # Behavioural, needs PHP, so it lives here rather than in the Perl
      # contract tests: runs the real EduAI_Exams::redact() over the fixture
      # and fails if answer_index/expected/explanation survive — the "exam
      # ships with its own answer key" regression.
      - name: PrepareME redaction guard
        run: php scripts/redaction-guard.php

  deploy:
    name: Deploy
    needs: lint
    # Pull requests get the checks above and stop there. Only main and a manual
    # dispatch reach the server.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      # ------------------------------------------------------------------
      # Option A — SSH/rsync (Cloudways, a VPS, most managed WP hosts).
      # Add these repository secrets:
      #   SSH_HOST, SSH_USER, SSH_PORT, SSH_PRIVATE_KEY, REMOTE_PATH
      # ------------------------------------------------------------------
      # Fail closed on the destination, before any rsync --delete runs.
      #
      # An empty REMOTE_PATH makes the target "USER@HOST:/wp-content/themes/…".
      # On an ordinary box that fails because /wp-content does not exist. On a
      # CHROOTED shared-hosting account — which Hostinger commonly is — it can
      # resolve inside the jail and SUCCEED, depositing the theme somewhere
      # nobody looks while the summary reports a clean deploy. A silent success
      # at the wrong path is worse than a loud failure at the right one.
      #
      # Same principle as scripts/live-checks.sh refusing a non-localhost
      # target: the operator who most needs this guard is the one who has just
      # pasted five secrets in a hurry.
      - name: Deploy destination is fully specified
        if: ${{ vars.DEPLOY_METHOD == 'ssh' }}
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
        run: |
          missing=
          [ -n "$SSH_HOST" ]    || missing="$missing SSH_HOST"
          [ -n "$SSH_USER" ]    || missing="$missing SSH_USER"
          [ -n "$REMOTE_PATH" ] || missing="$missing REMOTE_PATH"
          if [ -n "$missing" ]; then
            echo "::error::Empty deploy secret(s):$missing — refusing to rsync --delete against an unintended path."
            exit 1
          fi
          echo "destination fully specified"

      - name: Install the SSH key
        if: ${{ vars.DEPLOY_METHOD == 'ssh' }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.SSH_PORT || 22 }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync theme and plugins over rsync
        if: ${{ vars.DEPLOY_METHOD == 'ssh' }}
        run: |
          rsync -avz --delete \
            -e "ssh -p ${{ secrets.SSH_PORT || 22 }} -i ~/.ssh/id_ed25519" \
            --exclude '.git*' --exclude 'node_modules' \
            wp-content/themes/scholaris/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.REMOTE_PATH }}/wp-content/themes/scholaris/"

          rsync -avz --delete \
            -e "ssh -p ${{ secrets.SSH_PORT || 22 }} -i ~/.ssh/id_ed25519" \
            --exclude '.git*' \
            wp-content/plugins/eduai-assistant/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.REMOTE_PATH }}/wp-content/plugins/eduai-assistant/"

          rsync -avz --delete \
            -e "ssh -p ${{ secrets.SSH_PORT || 22 }} -i ~/.ssh/id_ed25519" \
            --exclude '.git*' \
            wp-content/plugins/scholaris-library/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.REMOTE_PATH }}/wp-content/plugins/scholaris-library/"

      # The rsync above ships CODE. It ships no CONFIGURATION: no pages, no
      # student role, no menu, no permalinks, no third-party plugin stack, and
      # no plugin tables — those are created on activation, and nothing above
      # activates anything. A server in that state is an unconfigured
      # WordPress wearing our theme, which is the failure shape this project
      # keeps producing: something that looks finished and is not. Here it
      # would land on a live domain.
      #
      # So configuration follows the sync in the same job. setup.sh is safe to
      # re-run — pages are counted by slug before creation, plugins guarded by
      # `is-installed`, `role create` tolerates an existing role, and option
      # updates are idempotent.
      - name: Configure the site over SSH (setup.sh)
        if: ${{ vars.DEPLOY_METHOD == 'ssh' }}
        env:
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
        run: |
          set -euo pipefail
          SSH="ssh -o BatchMode=yes -p ${SSH_PORT:-22} -i ~/.ssh/id_ed25519 ${SSH_USER}@${SSH_HOST}"

          if ! $SSH "command -v wp >/dev/null 2>&1"; then
            echo "::error::wp-cli is not on the server's PATH, so the site cannot be configured. The code is deployed but the site is NOT set up: no pages, no student role, no menu. Install WP-CLI, or run scripts/setup.sh by hand over SSH."
            exit 1
          fi

          # WordPress must ALREADY be installed. setup.sh's first branch runs
          # `wp core install` when it is not, and ADMIN_PASSWORD defaults to
          # "change-me-now" — that would create an administrator with a
          # publicly known password on a live domain. Never let CI reach it.
          if ! $SSH "wp --allow-root --path='${REMOTE_PATH}' core is-installed --skip-plugins --skip-themes"; then
            echo "::error::No WordPress install at ${REMOTE_PATH}. Refusing to continue: setup.sh would run 'wp core install' with the default admin password. Install WordPress with the host's installer first, then re-run this workflow."
            exit 1
          fi

          scp -o BatchMode=yes -P "${SSH_PORT:-22}" -i ~/.ssh/id_ed25519 \
            scripts/setup.sh "${SSH_USER}@${SSH_HOST}:/tmp/scholaris-setup.sh"

          # SITE_URL is read from the live install rather than guessed, so the
          # script cannot rewrite the site's own address to a placeholder.
          $SSH "SITE_URL=\$(wp --allow-root --path='${REMOTE_PATH}' option get siteurl) \
                WP_PATH='${REMOTE_PATH}' bash /tmp/scholaris-setup.sh" || rc=$?
          $SSH "rm -f /tmp/scholaris-setup.sh" || true
          exit "${rc:-0}"

      # ------------------------------------------------------------------
      # Option B — FTPS (shared hosting: Hostinger, Namecheap, GoDaddy).
      # Set the repository variable DEPLOY_METHOD to "ftp" and add secrets:
      #   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
      #
      # NOTE: FTPS has no shell, so the setup.sh step above cannot run on this
      # transport. An FTPS deploy ships code only and the site must be
      # configured by hand — which is the main reason docs/03 now recommends a
      # host with SSH.
      # ------------------------------------------------------------------
      - name: Upload over FTPS
        if: ${{ vars.DEPLOY_METHOD == 'ftp' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./wp-content/
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/uploads/**

      # Both transport steps above are gated on DEPLOY_METHOD. With it unset,
      # both skip and the job still succeeds — so without this, the summary
      # cheerfully read "Deployed <sha> via ssh" on a run that shipped nothing.
      # A deploy that no-ops silently is worse than one that fails: you only
      # find out when you check the server and yesterday's code is still on it.
      # Deliberately not a hard failure — main would go permanently red until a
      # host exists, and the checks above are the part that has to stay green.
      - name: Deployment summary
        run: |
          case "${{ vars.DEPLOY_METHOD }}" in
            ssh|ftp)
              echo "Deployed ${{ github.sha }} via ${{ vars.DEPLOY_METHOD }}" >> $GITHUB_STEP_SUMMARY
              ;;
            "")
              echo "::warning::No deploy target configured - NOTHING WAS SHIPPED. Set the repository variable DEPLOY_METHOD to 'ssh' or 'ftp' and add the matching secrets (docs/03-hosting-deployment.md)."
              echo "**Nothing was deployed.** \`${{ github.sha }}\` passed every check, but no host is configured yet: the repository variable \`DEPLOY_METHOD\` is unset, so both the rsync and FTPS steps were skipped. See \`docs/03-hosting-deployment.md\`." >> $GITHUB_STEP_SUMMARY
              ;;
            *)
              echo "::error::DEPLOY_METHOD is set to '${{ vars.DEPLOY_METHOD }}', which matches no transport. Expected 'ssh' or 'ftp'. Nothing was shipped."
              exit 1
              ;;
          esac
